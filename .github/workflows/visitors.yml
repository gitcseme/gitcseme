name: Unique visitors badge

on:
  schedule:
    - cron: "17 3 * * *"   # daily, well inside GitHub's 14-day traffic window
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Diagnostic: prints only the NAMES of secrets visible to this workflow.
      # Values are masked by Actions. Remove this step once the badge works.
      - name: Which secrets are visible?
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: echo "$ALL_SECRETS" | jq -r 'keys[]' || echo "(no secrets visible)"

      # The traffic API requires "Administration: read", which the built-in
      # GITHUB_TOKEN cannot be granted, so a PAT is required. See README.
      - name: Fetch traffic + accumulate unique visitors
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::TRAFFIC_TOKEN resolved to an empty string."
            echo "::error::It must be a *Repository* secret under Settings ->"
            echo "::error::Secrets and variables -> Actions (not Codespaces,"
            echo "::error::not Dependabot, not an Environment secret)."
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/traffic/views" > /tmp/views.json

          # history.json keeps one row per calendar day, so counts survive
          # past GitHub's rolling 14-day window instead of resetting.
          [ -f assets/history.json ] || echo '{}' > assets/history.json

          jq -s '
            .[0] as $hist
            | .[1].views as $new
            | reduce $new[] as $v ($hist; .[$v.timestamp[0:10]] = $v.uniques)
          ' assets/history.json /tmp/views.json > /tmp/history.json
          mv /tmp/history.json assets/history.json

          TOTAL=$(jq '[.[]] | add // 0' assets/history.json)
          jq -n --arg m "$TOTAL" '{
            schemaVersion: 1,
            label: "unique visitors",
            message: $m,
            color: "7aa2f7",
            labelColor: "1a1b27"
          }' > assets/visitors.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visitors.json assets/history.json
          git diff --staged --quiet || git commit -m "chore: update unique visitor count"
          git push
