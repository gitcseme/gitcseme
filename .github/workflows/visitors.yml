name: Unique visitors badge

on:
  schedule:
    - cron: "17 3 * * *"   # daily, well inside GitHub's 14-day traffic window
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The traffic API requires the "Administration: read" permission, which the
      # built-in GITHUB_TOKEN cannot be granted (it is not a valid scope in the
      # workflow `permissions:` block). A PAT is therefore required. See README.
      - name: Check token
        run: |
          if [ -z "${{ secrets.TRAFFIC_TOKEN }}" ]; then
            echo "::error::Secret TRAFFIC_TOKEN is not set. Create a fine-grained PAT with"
            echo "::error::'Administration: Read-only' on this repo and add it as TRAFFIC_TOKEN."
            exit 1
          fi

      - name: Fetch traffic + accumulate unique visitors
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/traffic/views" > /tmp/views.json

          # history.json keeps one row per calendar day, so counts survive
          # past GitHub's rolling 14-day window instead of resetting.
          [ -f assets/history.json ] || echo '{}' > assets/history.json

          jq -s '
            .[0] as $hist
            | .[1].views as $new
            | reduce $new[] as $v ($hist; .[$v.timestamp[0:10]] = $v.uniques)
          ' assets/history.json /tmp/views.json > /tmp/history.json
          mv /tmp/history.json assets/history.json

          TOTAL=$(jq '[.[]] | add // 0' assets/history.json)
          jq -n --arg m "$TOTAL" '{
            schemaVersion: 1,
            label: "unique visitors",
            message: $m,
            color: "7aa2f7",
            labelColor: "1a1b27"
          }' > assets/visitors.json

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/visitors.json assets/history.json
          git diff --staged --quiet || git commit -m "chore: update unique visitor count"
          git push
